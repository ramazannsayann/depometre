<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depometre</title>
<style>
  :root { --bg:#ffffff; --fg:#14213d; --muted:#5b6578; --line:#e3e7ee; --accent:#1e3a5f; --card:#f5f7fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1622; --fg:#e8ecf3; --muted:#9aa5b8; --line:#243044; --accent:#8fb4e3; --card:#172131; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 20px 64px; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 36px 0 8px; }
  p, li { margin: 0 0 12px; }
  ul { padding-left: 22px; margin: 0 0 12px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: .93rem; }
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
             padding: 16px 18px; margin: 24px 0 8px; }
  .summary p:last-child { margin-bottom: 0; }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Depometre</h1>
  <p>Yakıt fişinden gerçek tüketim, kilometre maliyeti ve depo tahmini.</p>
  <p><a href="/gizlilik">Gizlilik Politikası</a> · <a href="/destek">Destek</a></p>
</main>
</body>
</html>
